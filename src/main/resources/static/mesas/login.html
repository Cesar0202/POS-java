<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POS</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #F7F7F8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-flex p-3 rounded-circle mb-3">
                <i data-lucide="store" class="w-8 h-8"></i>
            </div>
            <h4 class="fw-bold text-dark">Ingresar al POS</h4>
            <p class="text-muted small">Inicia sesión para abrir tu turno</p>
        </div>

        <form action="/api/auth/login" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted fw-semibold small text-uppercase">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i data-lucide="user" class="w-4 h-4 text-muted"></i></span>
                    <input type="text" class="form-control" name="username" required placeholder="ej. admin">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted fw-semibold small text-uppercase">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i data-lucide="lock" class="w-4 h-4 text-muted"></i></span>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold d-flex justify-content-center align-items-center gap-2">
                Ingresar <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        // Check for error in URL
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('error')) {
            const form = document.querySelector('form');
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger small p-2 text-center mt-3';
            alert.textContent = 'Credenciales incorrectas';
            form.insertBefore(alert, form.firstChild);
        }
    </script>
</body>
</html>
